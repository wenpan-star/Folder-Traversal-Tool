<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📁 文件夹遍历工具 - 提取所有名称与路径</title>
<style>
/* ============================================================
   设计令牌（Design Tokens）
   ============================================================ */
:root {
    /* 品牌色 */
    --color-primary: #4f6ef7;
    --color-primary-dark: #3a56d4;
    --color-primary-light: #e8ecff;
    --color-primary-soft: #f3f6ff;

    /* 语义色 */
    --color-danger: #ef4444;
    --color-danger-dark: #dc2626;
    --color-danger-light: #fef2f2;
    --color-warning: #f59e0b;
    --color-warning-light: #fffbeb;
    --color-success: #10b981;
    --color-success-light: #ecfdf5;

    /* 中性色 */
    --color-bg: #f6f8fc;
    --color-surface: #ffffff;
    --color-surface-muted: #f8faff;
    --color-text: #1e293b;
    --color-text-secondary: #64748b;
    --color-text-tertiary: #94a3b8;
    --color-border: #e2e8f0;
    --color-border-strong: #cbd5e1;

    /* 尺寸 */
    --radius-md: 8px;
    --radius-sm: 6px;
    --radius-pill: 999px;

    /* 阴影 */
    --shadow-card: 0 4px 24px rgba(79, 110, 247, 0.10);
    --shadow-modal: 0 10px 40px rgba(15, 23, 42, 0.22);

    /* 字体 */
    --font-sans: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;

    /* 动效 */
    --transition-fast: 0.15s ease;
    --transition-base: 0.2s ease;
}

/* ============================================================
   全局重置
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.svg-sprite {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
}

/* ============================================================
   主容器
   ============================================================ */
.app {
    max-width: 1280px;
    width: 100%;
    background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    padding: 28px 32px 24px;
    display: flex;
    flex-direction: column;
    height: fit-content;
    max-height: 98vh;
}

/* ============================================================
   头部
   ============================================================ */
.header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--color-border);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    background: var(--color-primary-light);
    color: var(--color-primary);
    flex-shrink: 0;
}
.brand-icon svg {
    width: 20px;
    height: 20px;
}

.header-title-block {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header-left h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: var(--color-text);
    line-height: 1.25;
}

.header-left .subtitle {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 2px;
    line-height: 1.4;
}

.header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.header-divider {
    width: 1px;
    height: 22px;
    background: var(--color-border);
    margin: 0 2px;
}

/* ============================================================
   按钮体系
   ============================================================ */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: 13.5px;
    font-weight: 500;
    font-family: inherit;
    line-height: 1.4;
    cursor: pointer;
    transition: background var(--transition-fast),
                border-color var(--transition-fast),
                color var(--transition-fast),
                box-shadow var(--transition-fast);
    white-space: nowrap;
}

.btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
}

.btn:hover:not(:disabled) {
    background: var(--color-surface-muted);
    border-color: var(--color-border-strong);
}

.btn:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
}

.btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #ffffff;
}
.btn-primary:hover:not(:disabled) {
    background: var(--color-primary-dark);
    border-color: var(--color-primary-dark);
    box-shadow: 0 4px 12px rgba(79, 110, 247, 0.28);
}

.btn-ghost {
    background: var(--color-surface);
    color: var(--color-primary);
    border-color: #d3d9f5;
}
.btn-ghost:hover:not(:disabled) {
    background: var(--color-primary-soft);
    border-color: var(--color-primary);
}

.btn-danger-ghost {
    background: var(--color-surface);
    color: var(--color-danger);
    border-color: #fecaca;
}
.btn-danger-ghost:hover:not(:disabled) {
    background: var(--color-danger-light);
    border-color: var(--color-danger);
}

.btn-warning-ghost {
    background: var(--color-surface);
    color: var(--color-warning);
    border-color: #fde68a;
}
.btn-warning-ghost:hover:not(:disabled) {
    background: var(--color-warning-light);
    border-color: var(--color-warning);
}

.btn-neutral {
    background: var(--color-surface);
    color: var(--color-text-secondary);
    border-color: var(--color-border);
}

.btn-sm {
    padding: 5px 12px;
    font-size: 12.5px;
}
.btn-sm svg {
    width: 14px;
    height: 14px;
}

/* ============================================================
   统计栏
   ============================================================ */
.stats {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px 32px;
    padding: 14px 32px 16px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-bg);
    margin: 0 -32px;
}

.stats-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 13.5px;
}

.stats-item .num {
    font-weight: 700;
    font-size: 18px;
    color: var(--color-text);
    min-width: 28px;
    font-variant-numeric: tabular-nums;
}

.stats-item .num.total {
    color: var(--color-primary);
}

.stats-item .label {
    color: var(--color-text-secondary);
}

.stats-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13.5px;
    color: var(--color-text-secondary);
}

.status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-text-tertiary);
    flex-shrink: 0;
}

.status-dot.busy {
    background: var(--color-warning);
    animation: statusPulse 1s ease-in-out infinite;
}

.status-dot.ready {
    background: var(--color-success);
}

.status-dot.error {
    background: var(--color-danger);
}

@keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* 根路径 + 刷新按钮组合 */
.root-path-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    max-width: 320px;
}

.root-path {
    background: var(--color-surface);
    padding: 4px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--color-border);
    font-size: 12.5px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--color-text);
}

/* 圆形图标按钮：刷新 */
.btn-icon-refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: 50%;
    background: var(--color-surface);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: background var(--transition-fast),
                border-color var(--transition-fast),
                color var(--transition-fast);
    flex-shrink: 0;
    font-family: inherit;
}
.btn-icon-refresh svg {
    width: 14px;
    height: 14px;
    display: block;
}
.btn-icon-refresh:hover:not(:disabled) {
    background: var(--color-primary-light);
    border-color: var(--color-primary);
    color: var(--color-primary);
}
.btn-icon-refresh:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
}
.btn-icon-refresh:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
.btn-icon-refresh.spinning svg {
    animation: spinRefresh 0.9s linear infinite;
}

@keyframes spinRefresh {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* ============================================================
   工具栏
   ============================================================ */
.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 0 14px;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.toolbar-group.grow {
    flex: 1 1 220px;
}

.toolbar-divider {
    width: 1px;
    height: 24px;
    background: var(--color-border);
    flex-shrink: 0;
}

.search-box {
    flex: 1 1 200px;
    min-width: 140px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.search-box:focus-within {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
}

.search-box .search-icon {
    color: var(--color-text-tertiary);
    display: inline-flex;
    flex-shrink: 0;
}
.search-box .search-icon svg {
    width: 15px;
    height: 15px;
}

.search-box input {
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 13.5px;
    width: 100%;
    outline: none;
    color: var(--color-text);
    font-family: inherit;
}

.search-box input::placeholder {
    color: var(--color-text-tertiary);
}

.select-control {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.select-control:focus-within {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
}

.select-control label {
    font-size: 12.5px;
    color: var(--color-text-secondary);
    white-space: nowrap;
}

.select-control select {
    border: none;
    background: transparent;
    font-size: 13.5px;
    padding: 4px 6px;
    outline: none;
    cursor: pointer;
    color: var(--color-text);
    border-radius: 4px;
    font-family: inherit;
    max-width: 160px;
}

.select-control select:hover {
    background: #e9edf5;
}

.select-control select:disabled {
    cursor: not-allowed;
    color: var(--color-text-tertiary);
}

.depth-filter-count {
    font-size: 12px;
    color: var(--color-text-secondary);
    white-space: nowrap;
}

.toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-shrink: 0;
}

.badge {
    font-size: 12px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    padding: 3px 12px;
    border-radius: var(--radius-pill);
    font-weight: 500;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* ============================================================
   表格容器
   ============================================================ */
.table-wrap {
    flex: 1;
    overflow: auto;
    margin-top: 4px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    min-height: 180px;
    max-height: 55vh;
}

.table-wrap table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
}

.table-wrap thead {
    position: sticky;
    top: 0;
    z-index: 10;
}

.table-wrap th {
    background: #f1f4fa;
    color: var(--color-text-secondary);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 2px solid var(--color-border);
    white-space: nowrap;
}

.table-wrap td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--color-border);
    vertical-align: middle;
    word-break: break-word;
    line-height: 1.5;
}

.table-wrap tbody tr {
    transition: background var(--transition-fast);
}
.table-wrap tbody tr:hover {
    background: var(--color-surface-muted);
}
.table-wrap tbody tr:last-child td {
    border-bottom: none;
}

.col-index {
    width: 60px;
    text-align: center;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
}

.col-name {
    min-width: 140px;
    font-weight: 500;
}

.col-path {
    min-width: 200px;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    font-family: var(--font-mono);
}

.col-type {
    width: 90px;
    text-align: center;
}

.col-action {
    width: 72px;
    text-align: center;
}

.type-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    font-size: 11.5px;
    font-weight: 500;
    background: var(--color-bg);
    color: var(--color-text-secondary);
    white-space: nowrap;
}
.type-tag svg {
    width: 12px;
    height: 12px;
}
.type-tag.folder {
    background: #ede9fe;
    color: #6d28d9;
}
.type-tag.file {
    background: #d1fae5;
    color: #065f46;
}

.cell-name-inner {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}
.cell-name-inner .row-icon {
    display: inline-flex;
    color: var(--color-text-tertiary);
    flex-shrink: 0;
}
.cell-name-inner .row-icon svg {
    width: 15px;
    height: 15px;
}
.cell-name-inner .row-icon.folder {
    color: #7c3aed;
}

.btn-copy-path {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    color: var(--color-text-tertiary);
    cursor: pointer;
    padding: 6px;
    min-width: 32px;
    min-height: 32px;
    border-radius: var(--radius-sm);
    transition: background var(--transition-fast),
                color var(--transition-fast),
                border-color var(--transition-fast);
    font-family: inherit;
}
.btn-copy-path svg {
    width: 15px;
    height: 15px;
}
.btn-copy-path:hover {
    background: var(--color-primary-light);
    color: var(--color-primary);
    border-color: var(--color-primary-light);
}
.btn-copy-path:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 1px;
}
.btn-copy-path.copied {
    color: var(--color-success);
    background: var(--color-success-light);
}

/* ============================================================
   空状态
   ============================================================ */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--color-text-secondary);
    text-align: center;
}
.empty-state .empty-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    margin-bottom: 18px;
}
.empty-state .empty-icon svg {
    width: 30px;
    height: 30px;
}
.empty-state h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 6px;
}
.empty-state p {
    max-width: 420px;
    font-size: 13.5px;
    line-height: 1.6;
}

/* ============================================================
   分页控件
   ============================================================ */
.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 0 4px;
    flex-wrap: wrap;
}
.pagination .page-info {
    font-size: 12.5px;
    color: var(--color-text-secondary);
    margin: 0 8px;
    font-variant-numeric: tabular-nums;
}
.pagination .btn-page {
    min-width: 34px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-family: inherit;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-text);
    transition: background var(--transition-fast),
                border-color var(--transition-fast),
                color var(--transition-fast);
}
.pagination .btn-page:hover:not(:disabled) {
    background: var(--color-primary-soft);
    border-color: var(--color-primary);
    color: var(--color-primary);
}
.pagination .btn-page:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* ============================================================
   拖放提示覆盖层
   ============================================================ */
.drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(79, 110, 247, 0.15);
    backdrop-filter: blur(2px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.drop-overlay.active {
    display: flex;
}
.drop-overlay .drop-content {
    background: var(--color-surface);
    border: 3px dashed var(--color-primary);
    border-radius: var(--radius-md);
    padding: 48px 64px;
    text-align: center;
    pointer-events: auto;
}
.drop-overlay .drop-content .drop-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    margin-bottom: 16px;
}
.drop-overlay .drop-content .drop-icon svg {
    width: 36px;
    height: 36px;
}
.drop-overlay .drop-content h2 {
    font-size: 22px;
    margin-bottom: 8px;
    color: var(--color-primary);
    font-weight: 600;
}
.drop-overlay .drop-content p {
    color: var(--color-text-secondary);
    font-size: 14px;
}

/* ============================================================
   弹窗
   ============================================================ */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-overlay.active {
    display: flex;
}

.modal-content {
    background: var(--color-surface);
    border-radius: var(--radius-md);
    padding: 24px;
    max-width: 600px;
    width: 100%;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: var(--shadow-modal);
}

.modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}
.modal-header .modal-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--color-warning-light);
    color: var(--color-warning);
    flex-shrink: 0;
}
.modal-header .modal-icon.danger {
    background: var(--color-danger-light);
    color: var(--color-danger);
}
.modal-header .modal-icon svg {
    width: 18px;
    height: 18px;
}
.modal-header h3 {
    font-size: 16px;
    color: var(--color-text);
    font-weight: 600;
}

.modal-body p {
    font-size: 13.5px;
    color: var(--color-text-secondary);
    line-height: 1.6;
}

.modal-content ul {
    list-style: none;
    padding-left: 0;
}
.modal-content li {
    padding: 8px 12px;
    background: var(--color-bg);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--color-text-secondary);
    word-break: break-word;
    font-family: var(--font-mono);
    line-height: 1.5;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    z-index: 2200;
    max-width: 80vw;
    text-align: center;
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* ============================================================
   底部信息栏
   ============================================================ */
.footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 14px;
    font-size: 12px;
    color: var(--color-text-tertiary);
    flex-wrap: wrap;
    gap: 8px;
}
.footer-info .footer-tip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.footer-info .footer-tip svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
}
.footer-info .footer-version {
    font-weight: 500;
    color: var(--color-text-tertiary);
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 768px) {
    body { padding: 12px; }
    .app {
        padding: 16px;
        max-height: none;
        border-radius: var(--radius-sm);
    }
    .header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }
    .header-actions {
        flex-wrap: wrap;
    }
    .header-actions .btn {
        flex: 0 1 auto;
        font-size: 13px;
        padding: 7px 12px;
    }
    .header-divider {
        display: none;
    }
    .stats {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin: 0 -16px;
        padding: 12px 16px;
    }
    .stats-right {
        margin-left: 0;
        flex-wrap: wrap;
    }
    .root-path-group {
        max-width: 100%;
    }
    .stats-right .root-path {
        max-width: calc(100% - 40px);
    }
    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }
    .toolbar-divider {
        display: none;
    }
    .toolbar-group {
        width: 100%;
    }
    .toolbar-group.grow { flex: 1 1 auto; }
    .toolbar-right {
        margin-left: 0;
        justify-content: space-between;
        width: 100%;
    }
    .table-wrap {
        max-height: 40vh;
    }
    .table-wrap th,
    .table-wrap td {
        padding: 6px 10px;
        font-size: 12.5px;
    }
    .col-index { width: 42px; }
    .col-type { width: 66px; }
    .col-action { width: 56px; }
    .col-name { min-width: 90px; }
    .col-path { min-width: 120px; }
    .stats-item .num { font-size: 16px; }
    .pagination .btn-page {
        padding: 4px 9px;
        font-size: 12px;
    }
}

@media (max-width: 480px) {
    .header-left h1 { font-size: 17px; }
    .header-left .subtitle { display: none; }
    .btn {
        font-size: 12.5px;
        padding: 6px 12px;
    }
    .table-wrap { max-height: 32vh; }
    .stats-item { font-size: 13px; }
    .select-control select { max-width: 100px; }
}

<script>
// ============================================================
//  文件夹遍历工具 - v2.0.0（重构版 + 刷新能力）
//  本版本在保持原有全部功能的基础上，新增：
//  - 刷新按钮（位于统计栏根路径右侧），支持原生句柄直接重扫
//  - fallback / drop 模式下点击刷新会提示用户重新选择
//  - 刷新时保留搜索、层级、排序等用户设置
// ============================================================

(function () {
    'use strict';

    // ------------------------------------------------------------
    //  DOM 引用
    // ------------------------------------------------------------
    const buttonSelectFolder        = document.getElementById('btnSelect');
    const buttonCancelTraversal     = document.getElementById('btnCancel');
    const buttonExportCSV           = document.getElementById('btnExportCSV');
    const buttonExportText          = document.getElementById('btnExportText');
    const buttonClearAll            = document.getElementById('btnClear');
    const buttonCopyAllPaths        = document.getElementById('btnCopyAll');
    const buttonShowErrors          = document.getElementById('btnShowErrors');
    const buttonRefresh             = document.getElementById('btnRefresh');

    const searchInputElement        = document.getElementById('searchInput');
    const depthSelectElement        = document.getElementById('depthSelect');
    const depthFilterCountElement   = document.getElementById('depthFilterCount');
    const sortFieldSelectElement    = document.getElementById('sortFieldSelect');
    const sortOrderSelectElement    = document.getElementById('sortOrderSelect');

    const tableBodyElement          = document.getElementById('tableBody');

    const folderCountElement        = document.getElementById('folderCount');
    const fileCountElement          = document.getElementById('fileCount');
    const totalCountElement         = document.getElementById('totalCount');
    const rootPathDisplayElement    = document.getElementById('rootPathDisplay');
    const statusDotElement          = document.getElementById('statusDot');
    const statusLabelElement        = document.getElementById('statusLabel');
    const resultBadgeElement        = document.getElementById('resultBadge');
    const lastUpdateElement         = document.getElementById('lastUpdate');
    const versionInfoElement        = document.getElementById('versionInfo');

    const paginationContainerElement= document.getElementById('paginationContainer');
    const buttonPreviousPage        = document.getElementById('btnPrevPage');
    const buttonNextPage            = document.getElementById('btnNextPage');
    const pageInfoElement           = document.getElementById('pageInfo');

    const dropOverlayElement        = document.getElementById('dropOverlay');

    const errorModalOverlayElement  = document.getElementById('errorModalOverlay');
    const errorListElement          = document.getElementById('errorList');
    const buttonCloseErrorModal     = document.getElementById('btnCloseErrorModal');

    const clearConfirmOverlayElement= document.getElementById('clearConfirmOverlay');
    const buttonCancelClear         = document.getElementById('btnCancelClear');
    const buttonConfirmClear        = document.getElementById('btnConfirmClear');

    const toastElement              = document.getElementById('toast');

    // ------------------------------------------------------------
    //  状态
    // ------------------------------------------------------------
    let allEntries                 = [];          // 全部遍历结果
    let rootFolderName             = '';          // 根目录名称
    let isTraversing               = false;       // 是否正在遍历（含刷新）
    let toastTimer                 = null;        // Toast 定时器句柄
    let abortController            = null;        // 取消遍历控制器
    let currentPage                = 1;           // 当前页码（从 1 开始）
    const pageSize                 = 200;         // 每页条目数
    let totalPages                 = 1;           // 总页数
    let filteredEntriesForDisplay  = [];          // 当前过滤后的条目
    let searchQuery                = '';          // 当前搜索关键词
    let maxDepthLimit              = Infinity;    // 层级深度限制
    let currentSortField           = 'default';   // 当前排序字段
    let currentSortOrder           = 'asc';       // 当前排序方向
    let traversalErrorLog          = [];          // 遍历错误日志
    let hasShownDoubleClickHint    = false;       // 是否已提示过双击复制

    // 刷新能力相关：根目录句柄 + 来源模式
    // rootSourceMode 取值：
    //   'none'     — 尚未选择任何根目录
    //   'native'   — 通过 showDirectoryPicker 选择，持有 rootDirectoryHandle，可直接刷新
    //   'fallback' — 通过 <input webkitdirectory> 降级方案，无句柄，刷新需重新选择
    //   'drop'     — 通过拖放方式，无句柄，刷新需重新选择
    let rootDirectoryHandle        = null;
    let rootSourceMode             = 'none';

    // ------------------------------------------------------------
    //  常量
    // ------------------------------------------------------------
    const STORE_FILE_HANDLES = true;
    const CSV_MIME_TYPE      = 'text/csv;charset=utf-8';
    const TEXT_MIME_TYPE     = 'text/plain;charset=utf-8';
    const FALLBACK_TIMEOUT_MS= 30000;

    // ------------------------------------------------------------
    //  工具函数
    // ------------------------------------------------------------

    /**
     * 显示 Toast 提示
     * @param {string} message 提示内容
     * @param {number} duration 显示时长（毫秒）
     */
    function showToast(message, duration = 2600) {
        if (toastTimer) {
            clearTimeout(toastTimer);
            toastElement.classList.remove('show');
        }
        toastElement.textContent = message;
        toastElement.classList.add('show');
        toastTimer = setTimeout(() => {
            toastElement.classList.remove('show');
            toastTimer = null;
        }, duration);
    }

    /**
     * 设置状态指示器
     * @param {string} text 状态文本
     * @param {'ready'|'busy'|'error'} mode 状态模式
     */
    function setStatus(text, mode = 'ready') {
        statusLabelElement.textContent = text;
        statusDotElement.classList.remove('busy', 'ready', 'error');
        if (mode === 'busy') {
            statusDotElement.classList.add('busy');
        } else if (mode === 'error') {
            statusDotElement.classList.add('error');
        } else {
            statusDotElement.classList.add('ready');
        }
    }

    /**
     * HTML 转义，防止 XSS
     * @param {string} text 原文本
     * @returns {string}
     */
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    /**
     * CSV 字段转义：处理引号、逗号、换行，并防止公式注入
     * @param {any} value 原始值
     * @returns {string}
     */
    function csvEscape(value) {
        if (typeof value !== 'string') {
            value = String(value);
        }
        if (/^[=+\-@]/.test(value)) {
            value = "'" + value;
        }
        if (/[",\n\r]/.test(value)) {
            return '"' + value.replace(/"/g, '""') + '"';
        }
        return value;
    }

    /**
     * 按当前层级限制过滤条目（保留传入顺序）
     * @returns {Array}
     */
    function getEntriesByDepthLimit() {
        if (maxDepthLimit === Infinity) {
            return allEntries.slice();
        }
        return allEntries.filter(entry => entry.depth <= maxDepthLimit);
    }

    /**
     * 对条目数组应用当前排序
     * @param {Array} entryList
     * @returns {Array} 新数组
     */
    function applySorting(entryList) {
        const entriesCopy = entryList.slice();

        const defaultComparator = (a, b) => {
            if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
            return a.name.localeCompare(b.name);
        };

        let comparator;
        if (currentSortField === 'default') {
            comparator = defaultComparator;
        } else {
            comparator = (a, b) => {
                let valueA, valueB;
                switch (currentSortField) {
                    case 'name':
                        valueA = a.name.toLowerCase();
                        valueB = b.name.toLowerCase();
                        break;
                    case 'path':
                        valueA = a.path.toLowerCase();
                        valueB = b.path.toLowerCase();
                        break;
                    case 'type':
                        valueA = a.type;
                        valueB = b.type;
                        break;
                    case 'depth':
                        valueA = a.depth;
                        valueB = b.depth;
                        break;
                    case 'originalIndex':
                        valueA = a.originalIndex;
                        valueB = b.originalIndex;
                        break;
                    default:
                        return 0;
                }
                if (valueA < valueB) return -1;
                if (valueA > valueB) return 1;
                return 0;
            };
        }

        const finalComparator = currentSortOrder === 'desc'
            ? (a, b) => comparator(b, a)
            : comparator;

        return entriesCopy.sort(finalComparator);
    }

    /**
     * 对 allEntries 应用当前排序（原地替换引用）
     */
    function applySortingToAllEntries() {
        allEntries = applySorting(allEntries);
    }

    /**
     * 计算总页数
     * @param {number} totalItems
     * @returns {number}
     */
    function calculateTotalPages(totalItems) {
        return Math.max(1, Math.ceil(totalItems / pageSize));
    }

    /**
     * 获取指定页数据切片
     * @param {Array} data
     * @param {number} page
     * @returns {Array}
     */
    function getPageItems(data, page) {
        const startIndex = (page - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, data.length);
        return data.slice(startIndex, endIndex);
    }

    /**
     * 更新分页控件状态
     */
    function updatePaginationControls() {
        if (filteredEntriesForDisplay.length === 0) {
            paginationContainerElement.style.display = 'none';
            return;
        }
        paginationContainerElement.style.display = 'flex';
        totalPages = calculateTotalPages(filteredEntriesForDisplay.length);
        pageInfoElement.textContent = `第 ${currentPage} / ${totalPages} 页（共 ${filteredEntriesForDisplay.length} 条）`;
        buttonPreviousPage.disabled = currentPage <= 1;
        buttonNextPage.disabled = currentPage >= totalPages;
    }

    /**
     * 跳转到指定页
     * @param {number} page
     */
    function goToPage(page) {
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        if (page === currentPage && filteredEntriesForDisplay.length > 0) return;
        currentPage = page;
        renderTable();
        updatePaginationControls();
    }

    /**
     * 更新统计数据和按钮启用状态
     */
    function updateStatisticsAndButtons() {
        const folderCount = allEntries.filter(entry => entry.type === 'folder').length;
        const fileCount   = allEntries.filter(entry => entry.type === 'file').length;

        folderCountElement.textContent = folderCount;
        fileCountElement.textContent   = fileCount;
        totalCountElement.textContent  = allEntries.length;
        resultBadgeElement.textContent = allEntries.length + ' 条';

        const hasData = allEntries.length > 0;
        buttonExportCSV.disabled   = !hasData;
        buttonExportText.disabled  = !hasData;
        buttonClearAll.disabled    = !hasData;
        buttonCopyAllPaths.disabled= !hasData;
        depthSelectElement.disabled= !hasData;
        sortFieldSelectElement.disabled = !hasData;
        sortOrderSelectElement.disabled = !hasData;

        if (!hasData) {
            depthSelectElement.value = 'all';
            depthFilterCountElement.textContent = '';
            maxDepthLimit = Infinity;
        }

        updateRefreshButtonState();
    }

    /**
     * 更新刷新按钮的可用状态与视觉状态
     * 规则：
     *   - 无根目录来源（rootSourceMode === 'none'）→ 禁用
     *   - 遍历中（isTraversing）→ 禁用 + 图标旋转
     *   - 其他情况 → 启用，且根据来源模式动态设置 title
     */
    function updateRefreshButtonState() {
        const hasSource = rootSourceMode !== 'none';
        const canRefresh = hasSource && !isTraversing;

        buttonRefresh.disabled = !canRefresh;

        if (rootSourceMode === 'native') {
            buttonRefresh.title = '重新遍历当前根目录（无需再次选择）';
        } else if (rootSourceMode === 'fallback' || rootSourceMode === 'drop') {
            buttonRefresh.title = '当前方式无法自动刷新，点击后将重新选择文件夹';
        } else {
            buttonRefresh.title = '尚未选择文件夹';
        }

        if (isTraversing && hasSource) {
            buttonRefresh.classList.add('spinning');
        } else {
            buttonRefresh.classList.remove('spinning');
        }
    }

    /**
     * 更新层级深度下拉框选项
     */
    function updateDepthSelectOptions() {
        const select = depthSelectElement;
        const currentValue = select.value;
        select.innerHTML = '';

        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = '不限';
        select.appendChild(allOption);

        if (allEntries.length > 0) {
            const maxDepth = Math.max(...allEntries.map(entry => entry.depth || 0));
            for (let depth = 1; depth <= maxDepth; depth++) {
                const option = document.createElement('option');
                option.value = depth;
                option.textContent = `≤ ${depth} 层`;
                select.appendChild(option);
            }
        }

        if ([...select.options].some(option => option.value === currentValue)) {
            select.value = currentValue;
        } else {
            select.value = 'all';
        }
        maxDepthLimit = select.value === 'all' ? Infinity : parseInt(select.value, 10);
        updateDepthFilterCount();
    }

    /**
     * 更新层级过滤计数显示
     */
    function updateDepthFilterCount() {
        const filteredCount = getEntriesByDepthLimit().length;
        depthFilterCountElement.textContent = filteredCount > 0 ? `(${filteredCount} 条)` : '';
    }

    // ------------------------------------------------------------
    //  表格渲染
    // ------------------------------------------------------------

    /**
     * 渲染表格（应用层级过滤、排序、搜索、分页）
     */
    function renderTable() {
        let baseEntries  = getEntriesByDepthLimit();
        let sortedEntries = applySorting(baseEntries);

        const query = searchInputElement.value.trim().toLowerCase();
        searchQuery = query;

        if (query) {
            filteredEntriesForDisplay = sortedEntries.filter(entry =>
                entry.name.toLowerCase().includes(query) ||
                entry.path.toLowerCase().includes(query)
            );
        } else {
            filteredEntriesForDisplay = sortedEntries;
        }

        const computedPages = calculateTotalPages(filteredEntriesForDisplay.length);
        if (currentPage > computedPages) {
            currentPage = computedPages;
        }

        const pageData = getPageItems(filteredEntriesForDisplay, currentPage);

        if (pageData.length === 0) {
            renderEmptyState(query);
        } else {
            renderTableRows(pageData);
        }

        updatePaginationControls();
    }

    /**
     * 渲染空状态
     * @param {string} query 当前搜索关键词
     */
    function renderEmptyState(query) {
        const iconId = query ? 'icon-search' : 'icon-folder-open';
        const title  = query ? '没有匹配的条目' : '还没有数据';
        const desc   = query
            ? '试试调整关键词，或清除搜索后重试'
            : '点击「选择文件夹」，或将文件夹拖入窗口开始遍历';
        tableBodyElement.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-state">
                        <div class="empty-icon" aria-hidden="true">
                            <svg><use href="#${iconId}"/></svg>
                        </div>
                        <h3>${title}</h3>
                        <p>${desc}</p>
                    </div>
                </td>
            </tr>
        `;
    }

    /**
     * 渲染表格行
     * @param {Array} pageData 当前页数据
     */
    function renderTableRows(pageData) {
        let tableHtml = '';

        for (let index = 0; index < pageData.length; index++) {
            const entry = pageData[index];
            const globalIndex = (currentPage - 1) * pageSize + index + 1;
            const originalIndex = entry.originalIndex;
            const depth = entry.depth;
            const isFolder = entry.type === 'folder';

            const typeLabel = isFolder ? '文件夹' : '文件';
            const typeClass = isFolder ? 'folder' : 'file';
            const rowIconId = isFolder ? 'icon-folder' : 'icon-file';

            const nameEscaped = escapeHtml(entry.name);
            const pathEscaped = escapeHtml(entry.path);

            tableHtml += `
                <tr data-path="${pathEscaped}" title="双击复制路径">
                    <td class="col-index" title="原始索引：${originalIndex}，深度：${depth}">${globalIndex}</td>
                    <td class="col-name">
                        <span class="cell-name-inner">
                            <span class="row-icon ${isFolder ? 'folder' : ''}" aria-hidden="true">
                                <svg><use href="#${rowIconId}"/></svg>
                            </span>
                            <span>${nameEscaped}</span>
                        </span>
                    </td>
                    <td class="col-path" title="${pathEscaped}（深度 ${depth}）">${pathEscaped}</td>
                    <td class="col-type">
                        <span class="type-tag ${typeClass}">
                            <svg aria-hidden="true"><use href="#${rowIconId}"/></svg>
                            ${typeLabel}
                        </span>
                    </td>
                    <td class="col-action">
                        <button class="btn-copy-path" type="button" data-path="${pathEscaped}" title="复制路径" aria-label="复制路径：${pathEscaped}">
                            <svg aria-hidden="true"><use href="#icon-copy"/></svg>
                        </button>
                    </td>
                </tr>
            `;
        }

        tableBodyElement.innerHTML = tableHtml;

        tableBodyElement.querySelectorAll('.btn-copy-path').forEach(button => {
            button.addEventListener('click', function (event) {
                event.stopPropagation();
                const path = this.dataset.path;
                copyToClipboard(path, '已复制路径');
                this.classList.add('copied');
                setTimeout(() => this.classList.remove('copied'), 1200);
            });
        });

        tableBodyElement.querySelectorAll('tr[data-path]').forEach(row => {
            row.addEventListener('dblclick', function () {
                const path = this.dataset.path;
                copyToClipboard(path, '已复制路径');
                this.style.backgroundColor = 'var(--color-primary-light)';
                setTimeout(() => {
                    this.style.backgroundColor = '';
                }, 300);
            });
        });
    }

    // ------------------------------------------------------------
    //  剪贴板
    // ------------------------------------------------------------

    /**
     * 复制文本到剪贴板
     * @param {string} text
     * @param {string} successMessage
     */
    function copyToClipboard(text, successMessage = '已复制') {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMessage);
            }).catch(() => {
                fallbackCopyToClipboard(text);
            });
        } else {
            fallbackCopyToClipboard(text);
        }
    }

    /**
     * 降级复制方案
     * @param {string} text
     */
    function fallbackCopyToClipboard(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast('已复制');
        } catch (error) {
            showToast('复制失败，请手动复制');
        }
        document.body.removeChild(textArea);
    }

    // ------------------------------------------------------------
    //  遍历核心
    // ------------------------------------------------------------

    /**
     * 递归遍历目录（原生 File System Access API）
     */
    async function traverseDirectoryNative(directoryHandle, currentPath, signal, errorLog, onEntryFound) {
        try {
            for await (const [name, handle] of directoryHandle.entries()) {
                if (signal && signal.aborted) {
                    throw new DOMException('遍历已取消', 'AbortError');
                }
                const isFolder = handle.kind === 'directory';
                const fullPath = currentPath ? `${currentPath}/${name}` : name;
                const depth    = fullPath.split('/').length - 1;

                const entry = {
                    name: name,
                    path: fullPath,
                    type: isFolder ? 'folder' : 'file',
                    depth: depth,
                };
                if (STORE_FILE_HANDLES) {
                    entry.handle = handle;
                }

                onEntryFound(entry);

                if (isFolder) {
                    try {
                        await traverseDirectoryNative(handle, fullPath, signal, errorLog, onEntryFound);
                    } catch (error) {
                        if (error.name === 'AbortError') {
                            throw error;
                        }
                        errorLog.push(`无法访问目录：${fullPath}（${error.message || '未知错误'}）`);
                        console.warn('遍历子目录出错:', fullPath, error);
                    }
                }
            }
        } catch (error) {
            if (error.name === 'AbortError') {
                throw error;
            }
            errorLog.push(`遍历目录出错：${currentPath || directoryHandle.name}（${error.message || '未知错误'}）`);
            console.warn('遍历目录出错:', error);
        }
    }

    /**
     * 递归遍历目录（拖放方案：FileSystemDirectoryEntry）
     */
    function traverseDirectoryEntry(directoryEntry, currentPath, errorLog, onEntryFound) {
        return new Promise((resolve, reject) => {
            const reader = directoryEntry.createReader();
            const readEntries = () => {
                reader.readEntries(async (entries) => {
                    if (entries.length === 0) {
                        resolve();
                        return;
                    }
                    for (const entry of entries) {
                        const isFolder = entry.isDirectory;
                        const name = entry.name;
                        const fullPath = currentPath ? `${currentPath}/${name}` : name;
                        const depth = fullPath.split('/').length - 1;

                        const entryObject = {
                            name: name,
                            path: fullPath,
                            type: isFolder ? 'folder' : 'file',
                            depth: depth,
                        };
                        onEntryFound(entryObject);

                        if (isFolder) {
                            try {
                                await traverseDirectoryEntry(entry, fullPath, errorLog, onEntryFound);
                            } catch (error) {
                                errorLog.push(`无法访问目录：${fullPath}（${error.message || '未知错误'}）`);
                                console.warn('遍历子目录出错:', fullPath, error);
                            }
                        }
                    }
                    readEntries();
                }, (error) => {
                    errorLog.push(`读取目录出错：${currentPath || directoryEntry.name}（${error.message || '未知错误'}）`);
                    reject(error);
                });
            };
            readEntries();
        });
    }

    // ------------------------------------------------------------
    //  遍历期间按钮启用/禁用
    // ------------------------------------------------------------

    /**
     * 遍历期间设置按钮启用/禁用状态
     * @param {boolean} enabled
     */
    function setButtonsEnabledDuringTraversal(enabled) {
        buttonSelectFolder.disabled   = !enabled;
        buttonExportCSV.disabled      = !enabled || allEntries.length === 0;
        buttonExportText.disabled     = !enabled || allEntries.length === 0;
        buttonClearAll.disabled       = !enabled || allEntries.length === 0;
        buttonCopyAllPaths.disabled   = !enabled || allEntries.length === 0;
        searchInputElement.disabled   = !enabled;
        depthSelectElement.disabled   = !enabled;
        sortFieldSelectElement.disabled = !enabled;
        sortOrderSelectElement.disabled = !enabled;
        // 刷新按钮状态由 updateRefreshButtonState 统一控制
        updateRefreshButtonState();
    }

    // ------------------------------------------------------------
    //  选择文件夹（原生 File System Access API）
    // ------------------------------------------------------------

    async function handleSelectFolderNative() {
        if (isTraversing) return false;
        if (!window.showDirectoryPicker) {
            showToast('当前浏览器不支持 File System Access API，尝试使用降级方案', 4000);
            return false;
        }

        try {
            const rootHandle = await window.showDirectoryPicker();
            rootFolderName = rootHandle.name;
            rootPathDisplayElement.textContent = rootFolderName;

            // 关键：保存句柄以支持后续刷新
            rootDirectoryHandle = rootHandle;
            rootSourceMode = 'native';

            setStatus('正在遍历…', 'busy');
            isTraversing = true;
            setButtonsEnabledDuringTraversal(false);
            buttonCancelTraversal.style.display = 'inline-flex';
            buttonCancelTraversal.disabled = false;
            buttonShowErrors.style.display = 'none';

            // 首次选择：重置所有 UI 状态
            allEntries = [];
            filteredEntriesForDisplay = [];
            traversalErrorLog = [];
            currentPage = 1;
            maxDepthLimit = Infinity;
            depthSelectElement.value = 'all';
            depthFilterCountElement.textContent = '';
            sortFieldSelectElement.value = 'default';
            sortOrderSelectElement.value = 'asc';
            currentSortField = 'default';
            currentSortOrder = 'asc';
            updateDepthSelectOptions();
            renderTable();
            updateStatisticsAndButtons();

            abortController = new AbortController();
            const signal = abortController.signal;
            const errorLog = [];

            await traverseDirectoryNative(rootHandle, rootFolderName, signal, errorLog, (entry) => {
                entry.originalIndex = allEntries.length + 1;
                allEntries.push(entry);
            });

            applySortingToAllEntries();
            updateDepthSelectOptions();
            currentPage = 1;
            renderTable();
            updateStatisticsAndButtons();
            lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
            setStatus(`完成 — 共 ${allEntries.length} 个条目`, 'ready');

            if (errorLog.length > 0) {
                buttonShowErrors.style.display = 'inline-flex';
                buttonShowErrors.disabled = false;
                traversalErrorLog = errorLog;
                showToast(`有 ${errorLog.length} 个目录未能完全访问，点击「警告详情」查看`, 5000);
                console.warn('遍历警告详情:', errorLog);
            } else {
                buttonShowErrors.style.display = 'none';
                showToast(`遍历完成，共 ${allEntries.length} 个条目`, 2000);
            }

            maybeShowDoubleClickHint();
            return true;
        } catch (error) {
            if (error.name === 'AbortError' || (error.message && error.message.includes('abort'))) {
                setStatus('已取消（保留部分结果）', 'ready');
                applySortingToAllEntries();
                updateDepthSelectOptions();
                currentPage = 1;
                renderTable();
                updateStatisticsAndButtons();
                if (allEntries.length > 0) {
                    lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
                    showToast(`遍历已取消，保留了 ${allEntries.length} 条已获取的结果`, 3000);
                    maybeShowDoubleClickHint();
                } else {
                    showToast('遍历已取消', 2000);
                }
            } else if (error.name === 'NotAllowedError') {
                setStatus('权限被拒绝', 'error');
                showToast('权限被拒绝，无法访问文件夹', 4000);
                // 权限失败也保留 rootDirectoryHandle，用户可能重新授权
            } else {
                console.error(error);
                showToast('遍历失败：' + (error.message || '未知错误'), 4000);
                setStatus('出错', 'error');
            }
            return false;
        } finally {
            isTraversing = false;
            setButtonsEnabledDuringTraversal(true);
            buttonCancelTraversal.style.display = 'none';
            buttonCancelTraversal.disabled = true;
            abortController = null;
        }
    }

    // ------------------------------------------------------------
    //  降级方案（input webkitdirectory）
    // ------------------------------------------------------------

    async function handleSelectFolderFallback() {
        return new Promise((resolve) => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.webkitdirectory = true;
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            let isResolved = false;

            const cleanup = (result) => {
                if (!isResolved) {
                    isResolved = true;
                    document.body.removeChild(fileInput);
                    window.removeEventListener('focus', onWindowFocus);
                    clearTimeout(timeoutId);
                    resolve(result);
                }
            };

            const timeoutId = setTimeout(() => {
                cleanup(false);
            }, FALLBACK_TIMEOUT_MS);

            const onWindowFocus = () => {
                setTimeout(() => {
                    if (!isResolved) {
                        cleanup(false);
                    }
                }, 500);
            };
            window.addEventListener('focus', onWindowFocus);

            fileInput.addEventListener('change', async (event) => {
                const fileList = event.target.files;
                if (!fileList || fileList.length === 0) {
                    cleanup(false);
                    return;
                }

                // 标记来源为降级方案（无句柄）
                rootDirectoryHandle = null;
                rootSourceMode = 'fallback';

                isTraversing = true;
                setButtonsEnabledDuringTraversal(false);
                buttonCancelTraversal.style.display = 'inline-flex';
                buttonCancelTraversal.disabled = false;
                buttonShowErrors.style.display = 'none';
                setStatus('正在处理文件列表…', 'busy');

                allEntries = [];
                filteredEntriesForDisplay = [];
                traversalErrorLog = [];
                currentPage = 1;
                maxDepthLimit = Infinity;
                depthSelectElement.value = 'all';
                depthFilterCountElement.textContent = '';
                sortFieldSelectElement.value = 'default';
                sortOrderSelectElement.value = 'asc';
                currentSortField = 'default';
                currentSortOrder = 'asc';

                rootFolderName = fileList[0].webkitRelativePath.split('/')[0];
                rootPathDisplayElement.textContent = rootFolderName;

                const pathToFolderMap = new Map();
                const allFileEntries = [];

                let fileIndex = 0;
                const processNextBatch = () => {
                    const batchSize = 500;
                    const endIndex = Math.min(fileIndex + batchSize, fileList.length);

                    for (let i = fileIndex; i < endIndex; i++) {
                        const file = fileList[i];
                        const relativePath = file.webkitRelativePath;
                        const parts = relativePath.split('/');
                        const fileName = parts[parts.length - 1];
                        const depth = parts.length - 1;

                        allFileEntries.push({
                            name: fileName,
                            path: relativePath,
                            type: 'file',
                            depth: depth,
                            originalIndex: i + 1,
                        });

                        let folderPath = '';
                        for (let j = 0; j < parts.length - 1; j++) {
                            folderPath = folderPath ? `${folderPath}/${parts[j]}` : parts[j];
                            if (!pathToFolderMap.has(folderPath)) {
                                const folderDepth = folderPath.split('/').length - 1;
                                pathToFolderMap.set(folderPath, {
                                    name: parts[j],
                                    path: folderPath,
                                    type: 'folder',
                                    depth: folderDepth,
                                    originalIndex: 0,
                                });
                            }
                        }
                    }

                    fileIndex = endIndex;

                    if (fileIndex < fileList.length) {
                        setTimeout(processNextBatch, 0);
                    } else {
                        const folderEntries = Array.from(pathToFolderMap.values());
                        const combinedEntries = [...folderEntries, ...allFileEntries];
                        combinedEntries.forEach((entry, index) => {
                            entry.originalIndex = index + 1;
                        });
                        allEntries = combinedEntries;

                        applySortingToAllEntries();
                        updateDepthSelectOptions();
                        renderTable();
                        updateStatisticsAndButtons();
                        lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
                        setStatus(`完成 — 共 ${allEntries.length} 个条目（降级模式）`, 'ready');
                        showToast(`遍历完成，共 ${allEntries.length} 个条目（注意：空文件夹未包含）`, 3000);
                        cleanup(true);
                        maybeShowDoubleClickHint();
                    }
                };

                processNextBatch();
            });

            fileInput.addEventListener('cancel', () => {
                setStatus('已取消', 'ready');
                cleanup(false);
            });

            fileInput.click();
        });
    }

    // ------------------------------------------------------------
    //  拖放方案
    // ------------------------------------------------------------

    function handleDrop(event) {
        event.preventDefault();
        dropOverlayElement.classList.remove('active');

        if (isTraversing) {
            showToast('正在遍历中，请先取消当前遍历', 2000);
            return;
        }

        const items = event.dataTransfer.items;
        if (items.length === 0) return;

        const firstItem = items[0];
        if (firstItem.kind === 'file') {
            const entry = firstItem.webkitGetAsEntry();
            if (entry && entry.isDirectory) {
                startTraversalWithDirectoryEntry(entry);
            } else {
                showToast('请拖入文件夹，而不是单个文件', 3000);
            }
        }
    }

    async function startTraversalWithDirectoryEntry(directoryEntry) {
        rootFolderName = directoryEntry.name;
        rootPathDisplayElement.textContent = rootFolderName;

        // 拖放来源：无持久化句柄
        rootDirectoryHandle = null;
        rootSourceMode = 'drop';

        setStatus('正在遍历（拖放）…', 'busy');
        isTraversing = true;
        setButtonsEnabledDuringTraversal(false);
        buttonCancelTraversal.style.display = 'inline-flex';
        buttonCancelTraversal.disabled = false;
        buttonShowErrors.style.display = 'none';

        allEntries = [];
        filteredEntriesForDisplay = [];
        traversalErrorLog = [];
        currentPage = 1;
        maxDepthLimit = Infinity;
        depthSelectElement.value = 'all';
        depthFilterCountElement.textContent = '';
        sortFieldSelectElement.value = 'default';
        sortOrderSelectElement.value = 'asc';
        currentSortField = 'default';
        currentSortOrder = 'asc';
        updateDepthSelectOptions();
        renderTable();
        updateStatisticsAndButtons();

        const errorLog = [];

        try {
            await traverseDirectoryEntry(directoryEntry, rootFolderName, errorLog, (entry) => {
                entry.originalIndex = allEntries.length + 1;
                allEntries.push(entry);
            });

            applySortingToAllEntries();
            updateDepthSelectOptions();
            currentPage = 1;
            renderTable();
            updateStatisticsAndButtons();
            lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
            setStatus(`完成 — 共 ${allEntries.length} 个条目`, 'ready');

            if (errorLog.length > 0) {
                buttonShowErrors.style.display = 'inline-flex';
                buttonShowErrors.disabled = false;
                traversalErrorLog = errorLog;
                showToast(`有 ${errorLog.length} 个目录未能完全访问，点击「警告详情」查看`, 5000);
                console.warn('遍历警告详情:', errorLog);
            } else {
                showToast(`遍历完成，共 ${allEntries.length} 个条目`, 2000);
            }
            maybeShowDoubleClickHint();
        } catch (error) {
            console.error(error);
            setStatus('遍历失败', 'error');
            showToast('遍历失败：' + (error.message || '未知错误'), 4000);
        } finally {
            isTraversing = false;
            setButtonsEnabledDuringTraversal(true);
            buttonCancelTraversal.style.display = 'none';
            buttonCancelTraversal.disabled = true;
        }
    }

    // ------------------------------------------------------------
    //  统一选择文件夹入口
    // ------------------------------------------------------------

    async function handleSelectFolder() {
        if (isTraversing) return;

        const nativeHandled = await handleSelectFolderNative();
        if (nativeHandled) return;

        if (!window.showDirectoryPicker) {
            const tempInput = document.createElement('input');
            tempInput.type = 'file';
            if ('webkitdirectory' in tempInput) {
                await handleSelectFolderFallback();
            } else {
                showToast('当前浏览器不支持任何文件夹选择方式，请使用 Chrome / Edge 86+ 或拖放文件夹', 4000);
            }
        }
    }

    // ------------------------------------------------------------
    //  刷新（核心新增逻辑）
    // ------------------------------------------------------------

    /**
     * 刷新当前根目录。
     *
     * 策略：
     *   - rootSourceMode === 'native' 且持有 rootDirectoryHandle
     *     → 用同一句柄直接重扫（不弹权限窗口，无需用户操作）
     *     → 保留用户当前的搜索、层级、排序设置
     *   - rootSourceMode === 'fallback' 或 'drop'
     *     → 无持久化句柄，提示用户重新选择
     *   - rootSourceMode === 'none'
     *     → 无根目录，提示尚未选择
     */
    async function refreshTraversal() {
        if (isTraversing) return;

        // 无根目录来源：提示
        if (rootSourceMode === 'none') {
            showToast('尚未选择文件夹，请先选择或拖入', 2000);
            return;
        }

        // fallback / drop：无法自动刷新，引导用户重新选择
        if (rootSourceMode !== 'native' || !rootDirectoryHandle) {
            showToast('当前方式无法自动刷新，请重新选择文件夹', 2500);
            return;
        }

        // ---------- native 模式：直接重扫 ----------
        // 保留用户当前的 UI 设置（搜索、层级、排序）
        // 不重置 depthSelectElement.value / sortFieldSelectElement.value / sortOrderSelectElement.value / searchInputElement.value

        setStatus('正在刷新…', 'busy');
        isTraversing = true;
        setButtonsEnabledDuringTraversal(false);
        buttonCancelTraversal.style.display = 'inline-flex';
        buttonCancelTraversal.disabled = false;
        buttonShowErrors.style.display = 'none';

        // 只重置数据侧状态，UI 侧设置保留
        allEntries = [];
        filteredEntriesForDisplay = [];
        traversalErrorLog = [];
        currentPage = 1;

        renderTable();
        updateStatisticsAndButtons();

        abortController = new AbortController();
        const signal = abortController.signal;
        const errorLog = [];

        try {
            await traverseDirectoryNative(rootDirectoryHandle, rootFolderName, signal, errorLog, (entry) => {
                entry.originalIndex = allEntries.length + 1;
                allEntries.push(entry);
            });

            applySortingToAllEntries();
            // 根据新数据重新计算层级选项；会尽量保留用户此前的层级选择
            updateDepthSelectOptions();
            currentPage = 1;
            renderTable();
            updateStatisticsAndButtons();
            lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
            setStatus(`完成 — 共 ${allEntries.length} 个条目`, 'ready');

            if (errorLog.length > 0) {
                buttonShowErrors.style.display = 'inline-flex';
                buttonShowErrors.disabled = false;
                traversalErrorLog = errorLog;
                showToast(`刷新完成，有 ${errorLog.length} 个目录未能完全访问`, 5000);
                console.warn('遍历警告详情:', errorLog);
            } else {
                buttonShowErrors.style.display = 'none';
                showToast(`刷新完成，共 ${allEntries.length} 个条目`, 2000);
            }
        } catch (error) {
            if (error.name === 'AbortError' || (error.message && error.message.includes('abort'))) {
                setStatus('已取消（保留部分结果）', 'ready');
                applySortingToAllEntries();
                updateDepthSelectOptions();
                currentPage = 1;
                renderTable();
                updateStatisticsAndButtons();
                if (allEntries.length > 0) {
                    lastUpdateElement.textContent = `更新于 ${new Date().toLocaleString()}`;
                    showToast(`刷新已取消，保留了 ${allEntries.length} 条已获取的结果`, 3000);
                } else {
                    showToast('刷新已取消', 2000);
                }
            } else if (error.name === 'NotAllowedError') {
                setStatus('权限被拒绝', 'error');
                showToast('权限被拒绝，可能需要在浏览器中重新授权', 4000);
                // 保留 rootDirectoryHandle，用户可重试或重新选择
            } else {
                console.error(error);
                showToast('刷新失败：' + (error.message || '未知错误'), 4000);
                setStatus('刷新出错', 'error');
            }
        } finally {
            isTraversing = false;
            setButtonsEnabledDuringTraversal(true);
            buttonCancelTraversal.style.display = 'none';
            buttonCancelTraversal.disabled = true;
            abortController = null;
        }
    }

    // ------------------------------------------------------------
    //  取消遍历
    // ------------------------------------------------------------

    function cancelTraversal() {
        if (isTraversing && abortController) {
            abortController.abort();
            showToast('正在取消…', 1500);
        } else {
            showToast('当前遍历方式不支持取消，请等待完成', 2000);
        }
    }

    // ------------------------------------------------------------
    //  导出
    // ------------------------------------------------------------

    function exportCSV() {
        const exportEntries = getEntriesByDepthLimit();
        if (exportEntries.length === 0) {
            showToast('没有数据可导出', 2000);
            return;
        }

        const sortedExportEntries = applySorting(exportEntries);
        const header = '序号,名称,路径,类型,层级\n';
        const rows = sortedExportEntries.map((entry, index) => {
            const rowNumber = index + 1;
            const name = csvEscape(entry.name);
            const path = csvEscape(entry.path);
            const type = entry.type === 'folder' ? '文件夹' : '文件';
            const depth = entry.depth;
            return `${rowNumber},${name},${path},${type},${depth}`;
        }).join('\n');

        const content = header + rows;
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const filename = `folder_list_${timestamp}.csv`;

        downloadFile(content, filename, CSV_MIME_TYPE);
        showToast(`CSV 已导出（${sortedExportEntries.length} 条）`, 1800);
    }

    function exportText() {
        const exportEntries = getEntriesByDepthLimit();
        if (exportEntries.length === 0) {
            showToast('没有数据可导出', 2000);
            return;
        }

        const sortedExportEntries = applySorting(exportEntries);
        const lines = sortedExportEntries.map(entry => entry.path);
        const content = lines.join('\n');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const filename = `folder_paths_${timestamp}.txt`;

        downloadFile(content, filename, TEXT_MIME_TYPE);
        showToast(`文本已导出（${sortedExportEntries.length} 条）`, 1800);
    }

    function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    // ------------------------------------------------------------
    //  复制全部
    // ------------------------------------------------------------

    function copyAllPaths() {
        const exportEntries = getEntriesByDepthLimit();
        if (exportEntries.length === 0) {
            showToast('没有数据', 1500);
            return;
        }

        const sortedExportEntries = applySorting(exportEntries);
        const text = sortedExportEntries.map(entry => entry.path).join('\n');
        copyToClipboard(text, `已复制 ${sortedExportEntries.length} 条路径`);
    }

    // ------------------------------------------------------------
    //  清空数据（带二次确认）
    // ------------------------------------------------------------

    function requestClearAllData() {
        if (allEntries.length === 0) return;
        clearConfirmOverlayElement.classList.add('active');
        setTimeout(() => buttonCancelClear.focus(), 50);
    }

    function closeClearConfirmModal() {
        clearConfirmOverlayElement.classList.remove('active');
        buttonClearAll.focus();
    }

    function performClearAllData() {
        allEntries = [];
        filteredEntriesForDisplay = [];
        traversalErrorLog = [];
        currentPage = 1;
        maxDepthLimit = Infinity;
        depthSelectElement.value = 'all';
        depthFilterCountElement.textContent = '';
        sortFieldSelectElement.value = 'default';
        sortOrderSelectElement.value = 'asc';
        currentSortField = 'default';
        currentSortOrder = 'asc';

        // 清空根目录句柄与来源标记
        rootDirectoryHandle = null;
        rootSourceMode = 'none';

        updateDepthSelectOptions();
        renderTable();
        updateStatisticsAndButtons();
        rootPathDisplayElement.textContent = '未选择';
        lastUpdateElement.textContent = '';
        buttonShowErrors.style.display = 'none';
        setStatus('已清空', 'ready');
        closeClearConfirmModal();
        showToast('已清空所有数据', 1500);
    }

    // ------------------------------------------------------------
    //  搜索
    // ------------------------------------------------------------

    let searchTimer = null;

    function handleSearchInput() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentPage = 1;
            renderTable();
        }, 200);
    }

    // ------------------------------------------------------------
    //  层级选择变更
    // ------------------------------------------------------------

    function onDepthChange() {
        const value = depthSelectElement.value;
        maxDepthLimit = value === 'all' ? Infinity : parseInt(value, 10);
        currentPage = 1;
        renderTable();
        updateDepthFilterCount();

        const count = getEntriesByDepthLimit().length;
        const depthText = value === 'all' ? '不限深度' : `≤ ${value} 层`;
        showToast(`当前层级过滤显示 ${count} 条（${depthText}）`, 1500);
    }

    // ------------------------------------------------------------
    //  排序变更
    // ------------------------------------------------------------

    function onSortChange() {
        currentSortField = sortFieldSelectElement.value;
        currentSortOrder = sortOrderSelectElement.value;
        applySortingToAllEntries();
        currentPage = 1;
        renderTable();
        showToast('排序方式已更新', 1000);
    }

    // ------------------------------------------------------------
    //  分页事件
    // ------------------------------------------------------------

    function bindPaginationEvents() {
        buttonPreviousPage.addEventListener('click', function () {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        });
        buttonNextPage.addEventListener('click', function () {
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        });
    }

    // ------------------------------------------------------------
    //  错误弹窗
    // ------------------------------------------------------------

    function showErrorModal() {
        if (traversalErrorLog.length === 0) return;
        errorListElement.innerHTML = '';
        traversalErrorLog.forEach(errorMessage => {
            const li = document.createElement('li');
            li.textContent = errorMessage;
            errorListElement.appendChild(li);
        });
        errorModalOverlayElement.classList.add('active');
        setTimeout(() => buttonCloseErrorModal.focus(), 50);
    }

    function closeErrorModal() {
        errorModalOverlayElement.classList.remove('active');
        buttonShowErrors.focus();
    }

    // ------------------------------------------------------------
    //  双击复制提示（仅一次）
    // ------------------------------------------------------------

    function maybeShowDoubleClickHint() {
        if (hasShownDoubleClickHint) return;
        if (allEntries.length === 0) return;
        hasShownDoubleClickHint = true;
        setTimeout(() => {
            showToast('提示：双击任意行可快速复制路径', 3000);
        }, 2600);
    }

    // ------------------------------------------------------------
    //  拖放事件监听
    // ------------------------------------------------------------

    function setupDragAndDrop() {
        window.addEventListener('dragover', (event) => {
            event.preventDefault();
            if (!isTraversing) {
                dropOverlayElement.classList.add('active');
            }
        });

        window.addEventListener('dragleave', (event) => {
            if (event.relatedTarget === null) {
                dropOverlayElement.classList.remove('active');
            }
        });

        window.addEventListener('drop', (event) => {
            event.preventDefault();
            dropOverlayElement.classList.remove('active');
            handleDrop(event);
        });
    }

    // ------------------------------------------------------------
    //  初始化
    // ------------------------------------------------------------

    function initializeApplication() {
        // 按钮事件
        buttonSelectFolder.addEventListener('click', handleSelectFolder);
        buttonCancelTraversal.addEventListener('click', cancelTraversal);
        buttonExportCSV.addEventListener('click', exportCSV);
        buttonExportText.addEventListener('click', exportText);
        buttonClearAll.addEventListener('click', requestClearAllData);
        buttonCopyAllPaths.addEventListener('click', copyAllPaths);
        buttonShowErrors.addEventListener('click', showErrorModal);
        buttonCloseErrorModal.addEventListener('click', closeErrorModal);
        buttonCancelClear.addEventListener('click', closeClearConfirmModal);
        buttonConfirmClear.addEventListener('click', performClearAllData);
        buttonRefresh.addEventListener('click', refreshTraversal);

        searchInputElement.addEventListener('input', handleSearchInput);
        depthSelectElement.addEventListener('change', onDepthChange);
        sortFieldSelectElement.addEventListener('change', onSortChange);
        sortOrderSelectElement.addEventListener('change', onSortChange);

        bindPaginationEvents();
        setupDragAndDrop();

        // 点击遮罩关闭弹窗
        errorModalOverlayElement.addEventListener('click', (event) => {
            if (event.target === errorModalOverlayElement) closeErrorModal();
        });
        clearConfirmOverlayElement.addEventListener('click', (event) => {
            if (event.target === clearConfirmOverlayElement) closeClearConfirmModal();
        });

        // 初始状态
        depthSelectElement.disabled = true;
        sortFieldSelectElement.disabled = true;
        sortOrderSelectElement.disabled = true;
        depthSelectElement.value = 'all';
        sortFieldSelectElement.value = 'default';
        sortOrderSelectElement.value = 'asc';

        renderTable();
        updateStatisticsAndButtons();
        updateRefreshButtonState();
        setStatus('就绪 — 请选择文件夹或拖入', 'ready');
        rootPathDisplayElement.textContent = '未选择';
        versionInfoElement.textContent = 'v2.0.0';

        // 键盘快捷键
        document.addEventListener('keydown', (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === 'f') {
                event.preventDefault();
                searchInputElement.focus();
            }
            if (event.key === 'Escape') {
                if (clearConfirmOverlayElement.classList.contains('active')) {
                    closeClearConfirmModal();
                    return;
                }
                if (errorModalOverlayElement.classList.contains('active')) {
                    closeErrorModal();
                    return;
                }
                searchInputElement.blur();
            }
        });

        console.log('文件夹遍历工具已加载 (v2.0.0)');
        console.log('支持 File System Access API、拖放、层级限制、排序、分页与根目录刷新');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApplication);
    } else {
        initializeApplication();
    }

})();
</script>
</body>
